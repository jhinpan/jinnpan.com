name: Sync daily sync-up

on:
  schedule:
    # 08:40 PDT / 07:40 PST. GitHub Actions cron expressions use UTC.
    - cron: "40 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh the latest sync entry
        run: npm run sync:daily
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate the site
        run: |
          git diff --check
          npm run build

      - name: Commit and deploy the successful sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sources/daily-sync
          if git diff --cached --quiet; then
            echo "No sync changes to commit."
            exit 0
          fi
          git commit -m "chore: sync daily sync-up"
          git push origin HEAD:main
