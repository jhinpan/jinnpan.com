name: Sync PR board

on:
  schedule:
    # 09:10 PDT / 08:10 PST. GitHub Actions cron expressions use UTC.
    - cron: "10 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pr-board
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the board from GitHub
        run: npm run sync:prs
        env:
          # The board covers public repositories only, so the default token is enough.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate the site
        run: |
          git diff --check
          npm run build

      - name: Commit and deploy the refreshed board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/pr-board.json
          if git diff --cached --quiet; then
            echo "No board changes to commit."
            exit 0
          fi
          git commit -m "chore: sync pr board"
          # The other sync workflows push to main around the same hour.
          git pull --rebase origin main
          git push origin HEAD:main
