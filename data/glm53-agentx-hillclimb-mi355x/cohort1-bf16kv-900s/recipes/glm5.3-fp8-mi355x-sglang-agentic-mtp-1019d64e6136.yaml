schema: 2
name: glm5.3-fp8-mi355x-sglang-agentic_tp8_c2
model:
  path: hf:zai-org/GLM-5.3
  container: lmsysorg/sglang-rocm:v0.5.22-rocm720-mi35x-20261024
  precision: fp8
resources:
  gpu_type: mi355x
  gpus_per_node: 8
frontend:
  type: sglang
  enable_multiple_frontends: false
observability:
  enabled: false
  tachometer:
    enabled: false
engine: sglang
roles:
  agg:
    nodes: 1
    workers: 1
    args:
      served-model-name: zai-org/GLM-5.3
      trust-remote-code: true
      kv-cache-dtype: fp8_e4m3
      dsa-prefill-backend: tilelang
      dsa-decode-backend: tilelang
      tool-call-parser: glm47
      reasoning-parser: glm45
      chunked-prefill-size: 32768
      mem-fraction-static: 0.85
      speculative-algorithm: EAGLE
      speculative-num-steps: 3
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4
      watchdog-timeout: 1800
      enable-metrics: true
      tensor-parallel-size: 8
      expert-parallel-size: 1
      max-running-requests: 4
      cuda-graph-max-bs-decode: 4
    env:
      PYTHONNOUSERSITE: '1'
      SGLANG_TIMEOUT_KEEP_ALIVE: '900'
      SGLANG_OPT_USE_TOPK_V2: 'false'
      SGLANG_SIMULATE_ACC_LEN: '2.99'
      SGLANG_SIMULATE_ACC_METHOD: match-expected
      SGLANG_SIMULATE_ACC_TOKEN_MODE: real-draft-token
    gpus: 8
benchmark:
  env:
    AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
    CONC: '2'
    KV_OFFLOADING: none
    MODEL: zai-org/GLM-5.3
    REQUIRE_POWER: '0'
    ENABLE_AGENTX_POWER: '1'
  type: custom
  command: bash /infmax-workspace/benchmarks/srt_agentic.sh
  concurrencies:
  - 2
telemetry:
  enabled: true
  storage_subdir: power
  startup_timeout_seconds: 300
  required: false
