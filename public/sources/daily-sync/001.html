<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Daily Sync-Up 001 — a result-driven log of open-source pull requests authored and reviewed as jhinpan, generated from live GitHub data." />
  <meta name="agent-data" content="#sync-meta, #pr-data and #notes-data contain the structured records. #pr-data is regenerated by scripts/sync-daily-sync.mjs; #notes-data is hand-authored." />
  <title>Daily Sync-Up 001</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #faf8f4;
      --panel: #ffffff;
      --panel-alt: #f5f2ec;
      --text: #1b1815;
      --muted: #7a726a;
      --faint: #a49b91;
      --line: #e2ddd4;
      --line-strong: #cdc5b9;
      --accent: #b8452a;
      --accent-soft: #f6e9e4;
      --authored: #c2562f;
      --reviewed: #2f5d8a;
      --add: #2c6e4b;
      --del: #a8402f;
      --radius: 6px;
      --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #14120f;
        --panel: #1c1a16;
        --panel-alt: #23201b;
        --text: #efe9e0;
        --muted: #a79d91;
        --faint: #7d7368;
        --line: #332f28;
        --line-strong: #4d473d;
        --accent: #e08363;
        --accent-soft: #3a251d;
        --authored: #e08a5c;
        --reviewed: #7fb0dd;
        --add: #74c096;
        --del: #e08d7c;
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font: inherit; cursor: pointer; }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px clamp(16px, 4vw, 32px) 96px;
    }

    /* ---------- masthead ---------- */
    .masthead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .backlink {
      display: inline-block;
      margin-bottom: 18px;
      color: var(--faint);
      font: 11px var(--mono);
    }
    .kicker {
      margin: 0;
      color: var(--accent);
      font: 11px var(--mono);
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 6px 0 0;
      font-size: clamp(30px, 5.2vw, 46px);
      line-height: 1.05;
      letter-spacing: -.03em;
      font-weight: 700;
    }
    .lang-switch {
      display: inline-flex;
      flex: none;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
    }
    .lang-switch button {
      min-height: 28px;
      padding: 4px 10px;
      border: 0;
      border-right: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      font: 10px var(--mono);
      letter-spacing: .06em;
    }
    .lang-switch button:last-child { border-right: 0; }
    body[data-lang="zh"] .lang-switch button[data-set-lang="zh"],
    body[data-lang="en"] .lang-switch button[data-set-lang="en"] {
      color: #fff;
      background: var(--text);
    }

    /* ---------- section rail ---------- */
    .rail {
      margin: 14px 0 0;
      color: var(--faint);
      font: 12px var(--mono);
    }
    .rail a { color: var(--faint); }
    .rail a.on { color: var(--text); font-weight: 700; }
    .rail .sep { margin: 0 4px; opacity: .55; }
    .rail .note { margin-left: 8px; font-style: italic; }

    .lede {
      margin: 18px 0 0;
      max-width: 62ch;
      color: var(--muted);
      font-size: 14px;
    }
    .lede strong { color: var(--text); }

    /* ---------- stat cards ---------- */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 26px;
    }
    .stat {
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }
    .stat .label {
      color: var(--muted);
      font-size: 11px;
    }
    .stat .value {
      margin-top: 6px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.1;
    }
    .stat .value.mono { font-family: var(--mono); font-size: 19px; }
    .stat .unit {
      margin-top: 3px;
      color: var(--faint);
      font: 10px var(--mono);
    }
    .add { color: var(--add); }
    .del { color: var(--del); }

    /* ---------- timeline ---------- */
    .timeline {
      margin-top: 30px;
      padding: 6px 0 0;
    }
    .timeline svg { display: block; width: 100%; height: auto; overflow: visible; }
    .tl-axis { stroke: var(--line-strong); stroke-width: 1; }
    .tl-tick { fill: var(--faint); font: 10px var(--mono); text-anchor: middle; }
    .tl-lane { fill: var(--muted); font: 11px var(--mono); }
    .tl-num { fill: var(--faint); font: 9px var(--mono); text-anchor: middle; }
    .tl-dot { cursor: pointer; }
    .tl-dot:hover { stroke: var(--text); stroke-width: 1.5; }
    .legend {
      display: flex;
      gap: 18px;
      margin-top: 4px;
      color: var(--muted);
      font: 11px var(--mono);
    }
    .legend i {
      display: inline-block;
      width: 8px; height: 8px;
      margin-right: 6px;
      border-radius: 50%;
      vertical-align: 1px;
    }
    .caption {
      margin: 12px 0 0;
      max-width: 62ch;
      color: var(--muted);
      font-size: 13px;
    }

    /* ---------- table ---------- */
    table {
      width: 100%;
      margin-top: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      border-collapse: separate;
      border-spacing: 0;
      background: var(--panel);
      overflow: hidden;
    }
    thead th {
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-alt);
      color: var(--faint);
      font: 10px var(--mono);
      font-weight: 400;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-align: left;
      white-space: nowrap;
    }
    tbody td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      vertical-align: top;
    }
    tbody tr:last-child td { border-bottom: 0; }
    td.pr a { font: 12px var(--mono); font-weight: 700; }
    td.what { line-height: 1.35; }
    td.num { font: 12px var(--mono); white-space: nowrap; }
    .role {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 3px;
      font: 10px var(--mono);
      letter-spacing: .04em;
    }
    .role.authored { color: var(--authored); background: var(--accent-soft); }
    .role.reviewed { color: var(--reviewed); background: var(--panel-alt); }
    .notes-btn {
      padding: 0;
      border: 0;
      background: none;
      color: var(--faint);
      font: 10px var(--mono);
      white-space: nowrap;
    }
    .notes-btn:hover { color: var(--accent); }
    tr.note-row td {
      padding: 0 12px 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.55;
    }
    tr.note-row[hidden] { display: none; }

    /* ---------- prose sections ---------- */
    section.block { margin-top: 44px; }
    section.block > h2 {
      margin: 0 0 4px;
      font: 11px var(--mono);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 400;
    }
    section.block > .h2sub {
      margin: 0 0 14px;
      color: var(--faint);
      font-size: 12px;
    }
    ol.items { margin: 0; padding: 0; list-style: none; counter-reset: item; }
    ol.items > li {
      position: relative;
      padding: 12px 0 12px 30px;
      border-top: 1px solid var(--line);
      counter-increment: item;
    }
    ol.items > li::before {
      content: counter(item, decimal-leading-zero);
      position: absolute;
      left: 0; top: 14px;
      color: var(--faint);
      font: 10px var(--mono);
    }
    ol.items .t { font-size: 14px; font-weight: 600; }
    ol.items .d { margin-top: 3px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    ol.items .meta { margin-top: 6px; color: var(--faint); font: 10px var(--mono); }
    .empty {
      padding: 14px 0;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 13px;
      font-style: italic;
    }

    footer.colophon {
      margin-top: 56px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font: 11px var(--mono);
      line-height: 1.7;
    }

    [data-lang="en"] .zh-only { display: none; }
    [data-lang="zh"] .en-only { display: none; }

    @media (max-width: 620px) {
      .hide-sm { display: none; }
    }
  </style>
</head>

  <script>
    (() => {
      const readJson = (id) => JSON.parse(document.getElementById(id).textContent);
      const meta = readJson("sync-meta");
      const prs = readJson("pr-data");
      const notes = readJson("notes-data");

      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text != null) node.textContent = text;
        return node;
      };

      /* Merge timestamps are UTC; the log reads in the author's own day, so every
         date is rendered in the meta time zone rather than the visitor's. */
      const zone = meta.timeZone || "America/Los_Angeles";
      const dayKey = (iso) =>
        new Intl.DateTimeFormat("en-CA", {
          timeZone: zone, year: "numeric", month: "2-digit", day: "2-digit",
        }).format(new Date(iso));
      const shortDay = (iso) =>
        new Intl.DateTimeFormat("en-US", {
          timeZone: zone, month: "numeric", day: "numeric",
        }).format(new Date(iso));

      const authored = prs.filter((p) => p.role === "authored");
      const reviewed = prs.filter((p) => p.role === "reviewed");
      const sum = (list, key) => list.reduce((acc, p) => acc + (p[key] || 0), 0);

      const fmt = (n) => n.toLocaleString("en-US");
      const repoLabel = (meta.repositories || []).join(" · ") || "—";

      /* ---------- rail ---------- */
      const railSections = [
        ["results", "#prTable"],
        ["blockers", "#blockers"],
        ["questions", "#questions"],
        ["ideas", "#ideas"],
      ];
      const rail = $("rail");
      railSections.forEach(([name, href], i) => {
        if (i) rail.append(Object.assign(el("span", "sep"), { textContent: ">" }));
        const a = el("a", null, name);
        a.href = href;
        const populated =
          name === "results" ? prs.length > 0 : (notes[name] || []).length > 0;
        if (populated) a.classList.add("on");
        rail.append(a);
      });
      const railNote = el("span", "note");
      railNote.dataset.en = notes.railNote.en;
      railNote.dataset.zh = notes.railNote.zh;
      rail.append(railNote);

      /* ---------- lede ---------- */
      const windowLabel = `${shortDay(meta.windowStart + "T12:00:00Z")} – ${shortDay(meta.windowEnd + "T12:00:00Z")}`;
      const fill = (tpl) =>
        tpl
          .replace("{window}", windowLabel)
          .replace("{login}", meta.githubLogin)
          .replace("{repos}", repoLabel);
      const lede = $("lede");
      lede.dataset.en = fill(notes.lede.en);
      lede.dataset.zh = fill(notes.lede.zh);

      /* ---------- stats ---------- */
      const statCards = [
        {
          label: { en: "Authored & merged", zh: "我提交并合入" },
          value: String(authored.length), unit: "PRs",
        },
        {
          label: { en: "Reviewed to merge", zh: "我评审至合入" },
          value: String(reviewed.length), unit: "PRs",
        },
        {
          label: { en: "Lines, authored", zh: "我提交的行数" },
          html: `<span class="add">+${fmt(sum(authored, "additions"))}</span> <span class="del">−${fmt(sum(authored, "deletions"))}</span>`,
          unit: `${sum(authored, "changedFiles")} files · ${sum(authored, "commits")} commits`,
          mono: true,
        },
        {
          label: { en: "Repository", zh: "仓库" },
          value: repoLabel, unit: meta.hardware || "", mono: true,
        },
      ];
      const stats = $("stats");
      statCards.forEach((card) => {
        const box = el("div", "stat");
        const label = el("div", "label");
        label.dataset.en = card.label.en;
        label.dataset.zh = card.label.zh;
        box.append(label);
        const value = el("div", "value" + (card.mono ? " mono" : ""));
        if (card.html) value.innerHTML = card.html;
        else value.textContent = card.value;
        box.append(value);
        if (card.unit) box.append(el("div", "unit", card.unit));
        stats.append(box);
      });

      /* ---------- timeline ---------- */
      const NS = "http://www.w3.org/2000/svg";
      const svgEl = (tag, attrs) => {
        const node = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
        return node;
      };
      const dayIndex = (key) => {
        const start = Date.parse(meta.windowStart + "T00:00:00Z");
        return Math.round((Date.parse(key + "T00:00:00Z") - start) / 86400000);
      };
      const span = dayIndex(meta.windowEnd) || 1;

      const W = 760, H = 130, padL = 92, padR = 24, axisY = 96;
      const laneY = { authored: 34, reviewed: 68 };
      const xOf = (i) => padL + (i / span) * (W - padL - padR);

      const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
      svg.append(
        svgEl("line", { class: "tl-axis", x1: padL - 12, y1: axisY, x2: W - padR + 6, y2: axisY }),
      );
      for (let i = 0; i <= span; i += 1) {
        const x = xOf(i);
        const tick = svgEl("text", { class: "tl-tick", x, y: axisY + 15 });
        const d = new Date(Date.parse(meta.windowStart + "T12:00:00Z") + i * 86400000);
        tick.textContent = new Intl.DateTimeFormat("en-US", {
          timeZone: "UTC", month: "numeric", day: "numeric",
        }).format(d);
        svg.append(tick);
      }
      [["authored", "Authored"], ["reviewed", "Reviewed"]].forEach(([role]) => {
        const t = svgEl("text", { class: "tl-lane", x: 0, y: laneY[role] + 4 });
        t.textContent = role === "authored" ? "authored" : "reviewed";
        svg.append(t);
      });

      /* Two merges on the same day would overlap, so collisions fan out upward. */
      const seen = new Map();
      prs
        .slice()
        .sort((a, b) => Date.parse(a.mergedAt) - Date.parse(b.mergedAt))
        .forEach((pr) => {
          const key = `${pr.role}:${dayKey(pr.mergedAt)}`;
          const stack = seen.get(key) || 0;
          seen.set(key, stack + 1);
          const x = xOf(dayIndex(dayKey(pr.mergedAt)));
          const y = laneY[pr.role] - stack * 17;
          const dot = svgEl("circle", {
            class: "tl-dot", cx: x, cy: y, r: 5,
            fill: `var(--${pr.role})`,
          });
          const tip = svgEl("title", {});
          tip.textContent = `#${pr.number} · ${pr.title}`;
          dot.append(tip);
          const link = svgEl("a", { href: pr.url, target: "_blank", rel: "noreferrer" });
          link.append(dot);
          svg.append(link);
          const num = svgEl("text", { class: "tl-num", x, y: y - 9 });
          num.textContent = `#${pr.number}`;
          svg.append(num);
        });
      $("tlChart").append(svg);

      const busiest = [...seen.entries()].sort((a, b) => b[1] - a[1])[0];
      const busiestDay = busiest ? shortDay(busiest[0].split(":")[1] + "T12:00:00Z") : "—";
      const caption = $("tlCaption");
      caption.dataset.en = `${prs.length} merges across the window — authored on the top lane, reviewed below. ${busiestDay} was the dense day.`;
      caption.dataset.zh = `本期共 ${prs.length} 次合入，上排为我提交、下排为我评审。 ${busiestDay} 是最密集的一天。`;

      /* ---------- table ---------- */
      const body = $("prBody");
      prs
        .slice()
        .sort((a, b) => a.number - b.number)
        .forEach((pr) => {
          const tr = el("tr");

          const prCell = el("td", "pr");
          const a = el("a", null, `#${pr.number}`);
          a.href = pr.url;
          a.target = "_blank";
          a.rel = "noreferrer";
          prCell.append(a);
          tr.append(prCell);

          tr.append(el("td", "what", pr.short || pr.title));

          const roleCell = el("td");
          roleCell.append(el("span", `role ${pr.role}`, pr.role));
          tr.append(roleCell);

          tr.append(el("td", "num", shortDay(pr.mergedAt)));

          const lines = el("td", "num hide-sm");
          lines.innerHTML = `<span class="add">+${fmt(pr.additions)}</span> <span class="del">−${fmt(pr.deletions)}</span>`;
          tr.append(lines);

          tr.append(el("td", "num hide-sm", String(pr.changedFiles)));

          const toggleCell = el("td");
          tr.append(toggleCell);
          body.append(tr);

          if (!pr.note) return;
          const noteRow = el("tr", "note-row");
          noteRow.hidden = true;
          const noteCell = el("td", null, pr.note);
          noteCell.colSpan = 7;
          noteRow.append(noteCell);
          body.append(noteRow);

          const btn = el("button", "notes-btn");
          btn.type = "button";
          const sync = () => {
            btn.textContent = noteRow.hidden ? "notes ↓" : "notes ↑";
          };
          btn.addEventListener("click", () => {
            noteRow.hidden = !noteRow.hidden;
            sync();
          });
          sync();
          toggleCell.append(btn);
        });

      /* ---------- blockers / questions / ideas ---------- */
      const renderItems = (key, mount) => {
        const items = notes[key] || [];
        if (!items.length) {
          const empty = el("p", "empty");
          empty.dataset.en = "Nothing this entry.";
          empty.dataset.zh = "本期没有。";
          mount.append(empty);
          return;
        }
        const list = el("ol", "items");
        items.forEach((item) => {
          const li = el("li");
          const t = el("div", "t");
          t.dataset.en = item.title.en;
          t.dataset.zh = item.title.zh;
          li.append(t);
          const d = el("div", "d");
          d.dataset.en = item.detail.en;
          d.dataset.zh = item.detail.zh;
          li.append(d);
          if (item.meta) li.append(el("div", "meta", item.meta));
          list.append(li);
        });
        mount.append(list);
      };
      renderItems("blockers", $("blockersBody"));
      renderItems("questions", $("questionsBody"));
      renderItems("ideas", $("ideasBody"));

      /* ---------- colophon ---------- */
      const synced = meta.lastSuccessfulSync
        ? new Intl.DateTimeFormat("en-CA", {
            timeZone: zone, dateStyle: "medium", timeStyle: "short",
          }).format(new Date(meta.lastSuccessfulSync))
        : "not yet synced";
      $("colophon").innerHTML =
        `Results pulled from the ${meta.source}. Dates in ${zone}.<br />` +
        `Last successful sync: ${synced}. Generated by <code>${meta.generatedBy}</code>.`;

      /* ---------- language ---------- */
      const applyLang = (lang) => {
        document.body.dataset.lang = lang;
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        document.querySelectorAll("[data-en][data-zh]").forEach((node) => {
          node.textContent = node.dataset[lang];
        });
        try {
          localStorage.setItem("daily-sync-lang", lang);
        } catch {
          /* Private-mode storage denial must not break the toggle. */
        }
      };
      document.querySelectorAll("[data-set-lang]").forEach((btn) => {
        btn.addEventListener("click", () => applyLang(btn.dataset.setLang));
      });
      let initial = "en";
      try {
        initial = localStorage.getItem("daily-sync-lang") || "en";
      } catch {
        /* ignore */
      }
      applyLang(initial === "zh" ? "zh" : "en");
    })();
  </script>
</body>
</html>
